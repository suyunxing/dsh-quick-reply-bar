name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check entry points
        run: |
          node --check client.js
          node --check index.js
      - name: Check manifest and locale files
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!p.dsh||!p.dsh.bundle)throw new Error('missing dsh.bundle');for(const f of ['locale/zh.json','locale/en.json']){JSON.parse(fs.readFileSync(f,'utf8'))}console.log('manifest ok',p.name,p.version)"
      - name: Smoke test
        run: npm test

  publish:
    name: publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
