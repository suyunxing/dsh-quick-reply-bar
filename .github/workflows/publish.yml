name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    name: syntax + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check entry points
        run: |
          node --check client.js
          node --check index.js
      - name: Check manifest and locale files
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch)throw new Error('missing dsh.bundle.patch');for(const f of ['locale/zh.json','locale/en.json']){JSON.parse(fs.readFileSync(f,'utf8'))}console.log('manifest ok',p.name,p.version)"
      - name: Smoke test
        run: npm test

  publish:
    name: publish to npm (OIDC trusted publishing)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11 (OIDC 可信发布需要 >= 11.5.2，Node 22 自带 npm 10)
        run: npm install -g npm@11
      - name: Publish
        run: npm publish --access public --provenance

